<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#C68A66" />
<meta name="description" content="가본 곳에 색이 물드는 나만의 여행 지도" />
<title>내 여행 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#F1E9DC; --surface:#FDFAF4; --surface-2:#F7F0E5;
    --ink:#3C342B; --ink-soft:#8C7F6E; --line:#E7DBC8;
    --clay:#C68A66; --clay-deep:#B0744F;
    --plan:#BBB2A4;
    --spring:#E2A9B6; --summer:#86B392; --autumn:#D69A57; --winter:#9FB7C4;
    --shadow:0 14px 40px rgba(60,45,30,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  svg{display:block}
  .ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}

  .app{display:flex;flex-direction:column;height:100vh;max-width:520px;margin:0 auto;
    position:relative;background:var(--surface);box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .25s}
  .app.ready{opacity:1;pointer-events:auto}

  header{padding:14px 18px 12px;background:var(--surface);z-index:600;flex:none;border-bottom:1px solid var(--line)}
  .app-row{display:flex;align-items:center;justify-content:space-between}
  .app-name{font-size:18px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .app-name .dot{width:9px;height:9px;border-radius:50%;background:var(--clay)}
  .app-name small{font-size:11px;font-weight:600;color:var(--ink-soft)}
  .wbtns{display:flex;gap:6px;align-items:center}
  .wbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);
    border-radius:9px;padding:6px 8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;display:grid;place-items:center}
  .wbtn.on{background:var(--clay);color:#fff;border-color:var(--clay)}
  .wsep{width:1px;height:18px;background:var(--line);margin:0 2px}
  .quote{margin-top:10px;background:linear-gradient(90deg,#FBF1E8,#F6EEE0);
    border:1px solid var(--line);border-radius:13px;padding:9px 12px;
    font-size:12.5px;color:var(--clay-deep);font-weight:600;display:flex;align-items:center;gap:8px}

  .map-wrap{flex:1;position:relative}
  #map{position:absolute;inset:0;background:#E7DECB}
  .leaflet-container{font-family:inherit;background:#E7DECB}
  .weather-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:450}
  .weather-fx i{position:absolute;top:-12%}
  .weather-fx.rain i{width:1.5px;height:16px;border-radius:2px;
    background:linear-gradient(transparent,rgba(110,140,165,.55));animation:fall linear infinite}
  .weather-fx.snow i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.85);
    box-shadow:0 0 3px rgba(255,255,255,.6);animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(115vh)}}

  .hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:500;
    background:rgba(60,45,30,.82);color:#fff;font-size:12px;font-weight:600;
    padding:7px 14px;border-radius:999px;pointer-events:none;white-space:nowrap;transition:opacity .4s}

  .pin-dot{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 8px rgba(60,45,30,.3)}
  .pin-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;transform:translateY(-6px)}
  .pin-lbl{font-size:10px;font-weight:700;color:var(--ink);background:rgba(253,250,244,.9);
    padding:1px 6px;border-radius:6px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .pin-lbl.plan{color:var(--ink-soft)}

  .stats{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:10px 6px;flex:none}
  .stat{flex:1;text-align:center}
  .stat .n{font-size:17px;font-weight:800;color:var(--clay-deep)}
  .stat .l{font-size:10px;color:var(--ink-soft);margin-top:1px}
  .stat + .stat{border-left:1px solid var(--line)}

  .fab{position:absolute;right:16px;bottom:84px;z-index:550;width:54px;height:54px;
    border-radius:50%;background:var(--clay);color:#fff;border:none;cursor:pointer;
    box-shadow:0 8px 22px rgba(176,116,79,.45);display:grid;place-items:center}
  .fab .ic{width:26px;height:26px;stroke-width:2}

  .tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:8px 4px 12px;flex:none}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--ink-soft);cursor:pointer}
  .tab.on{color:var(--clay-deep)}
  .tab.dis{opacity:.4;cursor:not-allowed}
  .tab .badge2{font-size:8px;background:var(--surface-2);color:var(--ink-soft);border-radius:5px;padding:0 4px;margin-top:1px}

  .scrim{position:fixed;inset:0;background:rgba(44,36,28,.42);z-index:900;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
    background:var(--surface);border-radius:24px 24px 0 0;z-index:910;
    transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:88vh;display:flex;flex-direction:column}
  .sheet.show{transform:translateY(0)}
  .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 4px;flex:none}
  .sheet-body{overflow:auto;padding:8px 22px 26px}
  .sheet h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
  .sheet .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px}

  label.fld{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px}
  input[type=text],input[type=date],input[type=email],input[type=password],textarea,select{
    width:100%;font-family:inherit;font-size:14px;color:var(--ink);
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none}
  textarea{resize:none;height:84px;line-height:1.6}
  input:focus,textarea:focus,select:focus{border-color:var(--clay)}
  .seg{display:flex;gap:8px}
  .seg .opt{flex:1;text-align:center;font-size:13px;font-weight:700;padding:11px;
    border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink-soft);cursor:pointer}
  .seg .opt.on{background:var(--clay);color:#fff;border-color:var(--clay)}
  .mini-link{background:none;border:none;color:var(--clay-deep);font-size:12px;font-weight:700;
    cursor:pointer;font-family:inherit;text-decoration:underline}

  .suggest{margin-top:6px}
  .suggest:empty{display:none}
  .sg-item{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--surface-2);
    border:1px solid var(--line);cursor:pointer;font-size:13px}
  .sg-item + .sg-item{border-top:none}
  .sg-item:first-child{border-radius:12px 12px 0 0}
  .sg-item:last-child{border-radius:0 0 12px 12px}
  .sg-item:only-child{border-radius:12px}
  .sg-item:hover{background:#FBF1E9}
  .sg-item .ic{width:16px;height:16px;color:var(--clay);flex:none}
  .sg-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sg-msg{padding:10px 13px;font-size:12px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:12px}

  .wsel{display:flex;gap:8px;flex-wrap:wrap}
  .wsel .opt{flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:11.5px;font-weight:700;padding:10px 4px;border:1px solid var(--line);
    border-radius:12px;background:var(--surface-2);color:var(--ink-soft);cursor:pointer}
  .wsel .opt.on{background:#EAF1F4;border-color:#bcd4de;color:#5d7f8c}
  #wxNote{font-size:11.5px;color:var(--ink-soft);margin-top:6px}
  .rate{display:flex;gap:4px}
  .rate .ic{width:30px;height:30px;cursor:pointer;color:var(--line);stroke:var(--line)}
  .rate .ic.on{color:var(--clay);stroke:var(--clay);fill:var(--clay)}

  .photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .thumb{position:relative;width:66px;height:66px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border:none;border-radius:50%;
    background:rgba(44,36,28,.72);cursor:pointer;display:grid;place-items:center;padding:0}
  .thumb .rep{position:absolute;left:0;right:0;bottom:0;font-size:9px;text-align:center;
    background:var(--clay);color:#fff;font-weight:700;padding:1px 0}
  .photo-add{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;
    color:var(--clay-deep);border:1px dashed #d8c7ac;border-radius:12px;padding:11px 15px;cursor:pointer;background:var(--surface-2)}

  .savebtn{width:100%;margin-top:22px;background:var(--clay);color:#fff;border:none;border-radius:14px;
    padding:15px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 8px 20px rgba(176,116,79,.3)}
  .ghostbtn{width:100%;margin-top:10px;background:transparent;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:14px;padding:13px;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer}

  .det-photo-img{width:100%;height:225px;object-fit:cover;border-radius:14px;margin:2px 0 4px}
  .det-thumbs{display:flex;gap:6px;margin-top:7px}
  .det-thumbs img{width:56px;height:56px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 6px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
    padding:6px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
  .chip.weather{background:#EAF1F4;border-color:#D6E4EA;color:#5d7f8c}
  .chip.season{background:#FBEEDD;border-color:#F0DCC0;color:#b5824a}
  .chip.plan{background:#F0EDE6;border-color:#E2D9C9;color:#8C7F6E}
  .stars{display:flex;gap:2px;color:var(--clay);margin:4px 0 8px}
  .stars .ic{width:18px;height:18px}
  .stars .ic.fill{fill:var(--clay);stroke:var(--clay)}
  .note-box{font-size:13.5px;color:#5b5043;line-height:1.7;background:var(--surface-2);
    border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-top:10px;white-space:pre-wrap}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
  .meta{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
  .meta .ml{font-size:10px;color:var(--ink-soft)}
  .meta .mv{font-size:13.5px;font-weight:700;margin-top:4px}

  .ob-ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
    background:var(--surface-2);border:1px solid var(--line);color:var(--clay);margin:6px 0 18px}
  .goal{display:flex;align-items:center;gap:12px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
  .goal.sel{border-color:var(--clay);background:#FBF1E9}
  .goal .gi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
    background:var(--surface);color:var(--clay);flex:none}
  .goal.sel .gi{background:var(--clay);color:#fff}
  .goal .gt{font-size:14px;font-weight:700}
  .goal .gd{font-size:11.5px;color:var(--ink-soft);margin-top:1px}

  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    z-index:3000;opacity:0;transition:all .3s;pointer-events:none;max-width:86%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .badge-pop{position:fixed;top:-120px;left:50%;transform:translateX(-50%);z-index:3200;
    display:flex;align-items:center;gap:12px;background:var(--clay-deep);color:#fff;
    padding:12px 18px 12px 12px;border-radius:16px;box-shadow:0 12px 30px rgba(60,45,30,.35);
    transition:top .45s cubic-bezier(.2,.9,.3,1.25);max-width:90%}
  .badge-pop.show{top:16px}
  .badge-pop .bp-ic{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);
    display:grid;place-items:center;flex:none}
  .badge-pop .bp-t{font-size:11px;font-weight:700;opacity:.85}
  .badge-pop .bp-n{font-size:15px;font-weight:800;margin-top:1px}

  #cardStage{position:fixed;left:-99999px;top:0}
  .share-card{width:480px;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;font-family:inherit}
  .sc-photo{height:300px;background-size:cover;background-position:center}
  .sc-body{padding:22px 24px 24px}
  .sc-chips{display:flex;gap:8px;margin-bottom:12px}
  .sc-chips span{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--clay-deep)}
  .sc-title{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .sc-date{font-size:14px;color:var(--ink-soft);margin-top:6px}
  .sc-note{font-size:15px;color:#5b5043;line-height:1.7;margin-top:16px}
  .sc-brand{display:flex;align-items:center;gap:8px;margin-top:22px;font-size:13px;font-weight:700;color:var(--clay-deep)}
  .sc-brand .dot{width:9px;height:9px;border-radius:50%;background:var(--clay)}

  /* 로그인 화면 */
  .auth{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(900px 500px at 80% -10%,#F6EFE3,transparent),radial-gradient(700px 420px at 0% 110%,#EBE0CF,transparent),var(--bg)}
  .auth.show{display:flex}
  .auth-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);
    border-radius:22px;padding:30px 26px;box-shadow:var(--shadow);text-align:center}
  .auth-logo{width:56px;height:56px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
    background:var(--surface-2);border:1px solid var(--line);color:var(--clay)}
  .auth-card h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .auth-card .desc{font-size:13px;color:var(--ink-soft);margin:6px 0 22px}
  .auth-card input{margin-bottom:10px;text-align:left}
  .auth-msg{font-size:12px;min-height:16px;margin:2px 0 8px;text-align:left;color:var(--ink-soft)}
  .auth-toggle{font-size:13px;color:var(--ink-soft);margin-top:14px}
  .auth-toggle a{color:var(--clay-deep);font-weight:700;cursor:pointer;text-decoration:underline}
  .auth-tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
  .atab{flex:1;text-align:center;font-size:13.5px;font-weight:700;padding:9px;border-radius:9px;color:var(--ink-soft);cursor:pointer}
  .atab.on{background:var(--clay);color:#fff}
</style>
</head>
<body>

<!-- 로그인/회원가입 -->
<div class="auth" id="auth">
  <div class="auth-card">
    <div class="auth-logo"><svg class="ic" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg></div>
    <h2>내 여행 지도</h2>
    <div class="desc">가본 곳에 색이 물드는 나만의 지도</div>
    <div class="auth-tabs">
      <div class="atab on" id="atab_login" onclick="setAuthMode('login')">로그인</div>
      <div class="atab" id="atab_signup" onclick="setAuthMode('signup')">회원가입</div>
    </div>
    <input type="email" id="au_email" placeholder="이메일" autocomplete="email" />
    <input type="password" id="au_pw" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth()" />
    <input type="password" id="au_pw2" placeholder="비밀번호 확인" autocomplete="new-password" style="display:none" onkeydown="if(event.key==='Enter')doAuth()" />
    <div class="auth-msg" id="au_msg"></div>
    <button class="savebtn" id="au_submit" style="margin-top:6px" onclick="doAuth()">로그인</button>
  </div>
</div>

<div class="app">
  <header>
    <div class="app-row">
      <div class="app-name"><span class="dot"></span>내 여행 지도 <small>(이름 미정)</small></div>
      <div class="wbtns">
        <button class="wbtn on" data-w="clear" onclick="setWeather('clear')">맑음</button>
        <button class="wbtn" data-w="rain" onclick="setWeather('rain')">비</button>
        <button class="wbtn" data-w="snow" onclick="setWeather('snow')">눈</button>
        <span class="wsep"></span>
        <button class="wbtn" onclick="logout()" title="로그아웃">
          <svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/><path d="M10 8l-4 4 4 4M6 12h10"/></svg>
        </button>
      </div>
    </div>
    <div class="quote" id="quote">
      <svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
      <span id="quoteText">근교도, 당신의 여행입니다.</span>
    </div>
  </header>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="weather-fx" id="fx"></div>
    <div class="hint" id="hint">지도를 탭하거나 + 버튼으로 핀을 찍어보세요</div>
    <button class="fab" onclick="quickAdd()" title="핀 추가">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tabbar">
    <div class="tab on"><svg class="ic" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>지도</div>
    <div class="tab" onclick="showList()"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 10h16M9 5v14"/></svg>기록</div>
    <div class="tab dis"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>계획<span class="badge2">2단계</span></div>
    <div class="tab" onclick="showBadges()"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="M9 14l-2 7 5-3 5 3-2-7"/></svg>성취</div>
  </div>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" onclick="event.stopPropagation()">
  <div class="grab"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>
<div class="badge-pop" id="badgePop"></div>
<div id="cardStage"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------------- Supabase 연결 ---------------- */
const SB_URL='https://qhjonwpxupctrydhvasv.supabase.co';
const SB_KEY='sb_publishable_x_W61kHh9esVnq4KW7JUew_Dl1l2RER';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const ONBOARD_KEY='tmap_onboarded';

/* ---------------- 상수 ---------------- */
const QUOTES=[
  '근교도, 당신의 여행입니다.',
  '거창하지 않아도 좋아요. 오늘의 발걸음을 남겨요.',
  '비 오던 그날의 색은, 맑던 날과 다르니까요.',
  '이번 주말, 가까운 어딘가는 어때요?',
  '지도가 천천히, 당신의 색으로 물들어요.',

];

const SEASON_KO={spring:'봄',summer:'여름',autumn:'가을',winter:'겨울'};

let editingId=null, formPhotos=[], formData={type:'record',weather:'clear',rating:0};

function seasonOf(dateStr){
  const m=dateStr?(new Date(dateStr).getMonth()+1):(new Date().getMonth()+1);
  if(m>=3&&m<=5)return'spring'; if(m>=6&&m<=8)return'summer';
  if(m>=9&&m<=11)return'autumn'; return'winter';
}
function pinPayload(p){ const o=Object.assign({},p); delete o.id; return o; }

/* ---------------- 인증 ---------------- */
let authMode='login';
function setAuthMode(mode){
  authMode=mode;
  document.getElementById('atab_login').classList.toggle('on',mode==='login');
  document.getElementById('atab_signup').classList.toggle('on',mode==='signup');
  document.getElementById('au_pw2').style.display = mode==='signup'?'block':'none';
  document.getElementById('au_pw').placeholder = mode==='signup'?'비밀번호 (6자 이상)':'비밀번호';
  document.getElementById('au_pw').setAttribute('autocomplete', mode==='signup'?'new-password':'current-password');
  document.getElementById('au_submit').textContent = mode==='signup'?'회원가입':'로그인';
  document.getElementById('au_msg').textContent='';
}
function authErr(m){
  if(/invalid login credentials/i.test(m)) return '이메일 또는 비밀번호가 올바르지 않아요.';
  if(/already registered|already exists/i.test(m)) return '이미 가입된 이메일이에요. 로그인해 주세요.';
  if(/at least 6/i.test(m)) return '비밀번호는 6자 이상이어야 해요.';
  if(/invalid email/i.test(m)) return '이메일 형식을 확인해 주세요.';
  return m;
}
async function doAuth(){
  const email=document.getElementById('au_email').value.trim();
  const pw=document.getElementById('au_pw').value;
  const msg=document.getElementById('au_msg');
  if(!email||!pw){msg.style.color='#c2542f';msg.textContent='이메일과 비밀번호를 입력해 주세요.';return;}
  if(authMode==='signup'){
    const pw2=document.getElementById('au_pw2').value;
    if(pw.length<6){msg.style.color='#c2542f';msg.textContent='비밀번호는 6자 이상이어야 해요.';return;}
    if(pw!==pw2){msg.style.color='#c2542f';msg.textContent='비밀번호가 일치하지 않아요.';return;}
  }
  msg.style.color='var(--ink-soft)'; msg.textContent='처리 중…';
  try{
    let res = authMode==='signup'
      ? await sb.auth.signUp({email,password:pw})
      : await sb.auth.signInWithPassword({email,password:pw});
    if(res.error){ msg.style.color='#c2542f'; msg.textContent=authErr(res.error.message); return; }
    if(authMode==='signup' && !res.data.session){
      msg.style.color='var(--clay-deep)';
      msg.textContent='가입 완료! 이메일 인증 메일을 확인한 뒤 로그인해 주세요.';
      return;
    }
    /* 세션 생기면 onAuthStateChange가 앱으로 진입시킴 */
  }catch(e){ msg.style.color='#c2542f'; msg.textContent='오류가 발생했어요. 다시 시도해 주세요.'; }
}
async function logout(){
  await sb.auth.signOut();
  currentUser=null; state.pins=[]; if(map) renderPins();
  toast('로그아웃했어요');
}
function showAuth(){
  currentUser=null;
  document.querySelector('.app').classList.remove('ready');
  document.getElementById('auth').classList.add('show');
}
async function applySession(session){
  if(session && session.user){
    if(currentUser===session.user.id) return;
    currentUser=session.user.id;
    document.getElementById('auth').classList.remove('show');
    document.querySelector('.app').classList.add('ready');
    await loadPins();
    renderPins();
    if(map) map.invalidateSize();
    initAmbientWeather();
    if(!localStorage.getItem(ONBOARD_KEY)) setTimeout(showOnboarding,400);
  }else{
    showAuth();
  }
}

/* ---------------- 데이터(클라우드) ---------------- */
async function loadPins(){
  const {data,error}=await sb.from('travel_pins').select('id,data,created_at').order('created_at',{ascending:true});
  if(error){ console.error(error); toast('불러오기 실패: '+error.message); state.pins=[]; return; }
  state.pins=(data||[]).map(r=>Object.assign({id:r.id}, r.data||{}));
}

/* ---------------- 지도 ---------------- */
function initMap(){
  map=L.map('map',{zoomControl:true,attributionControl:false}).setView([36.3,127.8],7);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd'}).addTo(map);
  map.on('click',e=>{ if(currentUser) openAddForm(e.latlng, null, true); });
  renderPins();
}
function renderPins(){
  Object.values(markers).forEach(m=>map.removeLayer(m)); markers={};
  state.pins.forEach(p=>{
    const c=p.type==='plan'?'#BBB2A4':SEASON_COLOR[seasonOf(p.date)];
    const big=p.type==='record'?'width:22px;height:22px':'';
    const icon=L.divIcon({className:'',html:
      `<div class="pin-wrap"><div class="pin-dot" style="background:${c};${big}"></div>
       <div class="pin-lbl ${p.type==='plan'?'plan':''}">${esc(p.name)}</div></div>`,
      iconSize:[80,38],iconAnchor:[40,30]});
    const mk=L.marker([p.lat,p.lng],{icon}).addTo(map);
    mk.on('click',ev=>{L.DomEvent.stopPropagation(ev); openDetail(p.id);});
    markers[p.id]=mk;
  });
  renderStats(); hideHintIfAny();
}

/* ---------------- 통계 / 배지 ---------------- */
function renderStats(){
  const recs=state.pins.filter(p=>p.type==='record');
  const regions=new Set(recs.map(regionGuess));
  const weathers=new Set(recs.map(p=>p.weather).filter(Boolean));
  const badges=computeBadges().filter(b=>b.got).length;
  document.getElementById('stats').innerHTML=
    stat(recs.length,'기록한 곳')+stat(regions.size,'방문 지역')+stat(weathers.size,'모은 날씨')+stat(badges,'배지');
}
const stat=(n,l)=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`;
function regionGuess(p){
  if(p.lat>37.3&&p.lng<127.3)return'서울·경기';
  if(p.lat>37.0&&p.lng>128)return'강원';
  if(p.lat<34)return'제주';
  if(p.lng<127)return'전라';
  if(p.lat<36)return'경상';
  return'충청';
}
function computeBadges(){
  const recs=state.pins.filter(p=>p.type==='record');
  const weathers=new Set(recs.map(p=>p.weather));
  const regions=new Set(recs.map(regionGuess));
  const seasons=new Set(recs.map(p=>seasonOf(p.date)));
  return [
    {name:'비 수집가',desc:'비 오는 날 기록',got:weathers.has('rain'),ic:'<path d="M6 14a4 4 0 0 1 1-7.9A5 5 0 0 1 17 7a3.5 3.5 0 0 1 0 7H6z"/><path d="M9 18l-1 2M13 18l-1 2"/>'},
    {name:'눈의 추억',desc:'눈 오는 날 기록',got:weathers.has('snow'),ic:'<path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19"/>'},
    {name:'3지역 정복',desc:'서로 다른 지역 3곳',got:regions.size>=3,ic:'<path d="M2 12h6M16 12h6M12 2v6M12 16v6"/><circle cx="12" cy="12" r="3"/>'},
    {name:'사계절',desc:'네 계절 모두 기록',got:seasons.size>=4,ic:'<circle cx="12" cy="9" r="5"/><path d="M9 14l-2 7 5-3 5 3-2-7"/>'},
    {name:'첫 발걸음',desc:'첫 기록 남기기',got:recs.length>=1,ic:'<path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.2"/>'},
    {name:'열 곳의 추억',desc:'10곳 이상 기록',got:recs.length>=10,ic:'<path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/>'},
  ];
}

/* ---- 위치 연관검색어 ---- */
function onLocInput(){
  const q=document.getElementById('f_loc').value.trim();
  clearTimeout(locTimer);
  const box=document.getElementById('suggest');
  if(q.length<2){box.innerHTML='';return;}
  locTimer=setTimeout(()=>fetchSuggest(q),350);
}
async function fetchSuggest(q){
  const box=document.getElementById('suggest'); if(!box)return;
  box.innerHTML='<div class="sg-msg">검색 중…</div>';
  const base='https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=ko&q=';
  try{
    let res=await fetch(base+encodeURIComponent(q)+'&countrycodes=kr'); let j=await res.json();
    if(!j.length){ res=await fetch(base+encodeURIComponent(q)); j=await res.json(); }
    suggestList=j.slice(0,3).map(r=>({lat:parseFloat(r.lat),lng:parseFloat(r.lon),short:(r.display_name||'').split(',').slice(0,3).join(', ')}));
    if(!suggestList.length){ box.innerHTML='<div class="sg-msg">결과가 없어요. 지도를 직접 탭해도 돼요.</div>'; return; }
    box.innerHTML=suggestList.map((r,i)=>
      `<div class="sg-item" onclick="pickSuggest(${i})">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
        <span>${esc(r.short)}</span></div>`).join('');
  }catch(e){ box.innerHTML='<div class="sg-msg">검색 실패 — 인터넷 연결을 확인하세요.</div>'; }
}
function pickSuggest(i){
  const r=suggestList[i]; if(!r)return;
  pendingLatLng={lat:r.lat,lng:r.lng};
  const loc=document.getElementById('f_loc'); if(loc)loc.value=r.short;
  document.getElementById('suggest').innerHTML='';
  const note=document.getElementById('geoNote');
  if(note){note.innerHTML='위치 선택됨 — <span style="color:var(--ink-soft)">'+esc(r.short)+'</span>'; note.style.color='var(--clay-deep)';}
  map.flyTo([r.lat,r.lng],11);
  if(formData.type==='record') autoWeather(false);
}

/* ---- 사진 ---- */
function compressImage(file){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=e=>{const img=new Image();
      img.onload=()=>{const max=900;let w=img.width,h=img.height;
        if(w>h&&w>max){h=Math.round(h*max/w);w=max;} else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.7));
      };
      img.onerror=rej; img.src=e.target.result;
    };
    rd.onerror=rej; rd.readAsDataURL(file);
  });
}
async function handlePhotos(input){
  const files=[...input.files];
  for(const f of files){
    if(formPhotos.length>=6){toast('사진은 6장까지 넣을 수 있어요');break;}
    try{ formPhotos.push(await compressImage(f)); }catch(e){}
  }
  input.value=''; renderPhotoPreviews();
}
function removePhoto(i){formPhotos.splice(i,1);renderPhotoPreviews();}
function renderPhotoPreviews(){
  const row=document.getElementById('photoRow'); if(!row)return;
  row.innerHTML=formPhotos.map((src,i)=>
    `<div class="thumb"><img src="${src}">
      <button type="button" class="rm" onclick="removePhoto(${i})">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>${i===0?'<span class="rep">대표</span>':''}</div>`).join('');
}

/* ---- 날씨 자동 조회 ---- */
function wmoToWeather(c){
  if((c>=71&&c<=77)||c===85||c===86) return 'snow';
  if((c>=51&&c<=67)||(c>=80&&c<=82)||c>=95) return 'rain';
  if(c===0||c===1) return 'clear';
  return 'cloudy';
}
async function autoWeather(manual){
  const d=document.getElementById('f_date'); const note=document.getElementById('wxNote');
  if(!pendingLatLng){ if(manual&&note)note.textContent='먼저 위치를 골라주세요(검색 또는 지도 탭).'; return; }
  if(!d||!d.value) return;
  if(note)note.textContent='그날 날씨 불러오는 중…';
  try{
    const url=`https://archive-api.open-meteo.com/v1/archive?latitude=${pendingLatLng.lat}&longitude=${pendingLatLng.lng}&start_date=${d.value}&end_date=${d.value}&daily=weathercode&timezone=auto`;
    const r=await fetch(url); const j=await r.json();
    const code=j&&j.daily&&j.daily.weathercode?j.daily.weathercode[0]:null;
    if(code==null){ if(note)note.textContent='그날 날씨를 못 찾았어요(최근 날짜는 데이터가 늦어요). 직접 골라주세요.'; return; }
    const w=wmoToWeather(code); pickWeather(w);
    if(note)note.textContent='자동 인식: '+WEATHER_KO[w]+' · 그날 그곳 날씨 기준';
  }catch(e){ if(note)note.textContent='날씨 조회 실패 — 직접 골라주세요.'; }
}

/* ---- 접속 시점 현재 날씨로 지도 테마 자동 설정 (2번) ---- */
function initAmbientWeather(){
  const apply=(lat,lng)=>{
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=weather_code`)
      .then(r=>r.json()).then(j=>{
        const code=j&&j.current?j.current.weather_code:null;
        if(code==null)return;
        const w=wmoToWeather(code);
        setWeather(w==='cloudy'?'clear':w);
      }).catch(()=>{});
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>apply(pos.coords.latitude,pos.coords.longitude),
      ()=>apply(37.5665,126.9780),   // 위치 거부 시 서울 기준
      {timeout:6000,maximumAge:600000}
    );
  }else{ apply(37.5665,126.9780); }
}

/* ---- 지도에서 직접 찍은 위치 → 장소 이름 자동 채우기 (3번) ---- */
async function reverseGeocode(latlng){
  const loc=document.getElementById('f_loc'); const note=document.getElementById('geoNote');
  if(!loc)return;
  if(note){note.textContent='이 위치의 장소 이름 확인 중…'; note.style.color='var(--ink-soft)';}
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}&accept-language=ko&zoom=16`);
    const j=await r.json();
    const short=((j&&j.display_name)||'').split(',').slice(0,3).join(', ');
    if(short){
      loc.value=short;
      if(note){note.innerHTML='이 위치로 찍혀요 — <span style="color:var(--ink-soft)">'+esc(short)+'</span>'; note.style.color='var(--clay-deep)';}
    }else if(note){ note.textContent='위치 이름을 못 찾았어요. 직접 적어도 돼요.'; }
  }catch(e){ if(note)note.textContent='위치 확인 실패 — 직접 적어도 돼요.'; }
}

/* ---- 저장 (클라우드, 추가/수정 공용) ---- */
async function savePin(){
  if(!currentUser){toast('로그인이 필요해요');return;}
  if(!pendingLatLng){toast('위치를 먼저 골라주세요 — 검색 후보 선택 또는 지도 탭');return;}
  try{
    const _beforeBadges=gotBadgeNames();
    const name=document.getElementById('f_name').value.trim();
    const locName=document.getElementById('f_loc').value.trim();
    const isEdit=editingId!=null;
    let p = isEdit ? state.pins.find(x=>x.id===editingId) : {};
    p.name = name || locName || '이름 없는 곳';
    p.locName = locName;
    p.lat=pendingLatLng.lat; p.lng=pendingLatLng.lng; p.type=formData.type;
    if(formData.type==='record'){
      p.date=document.getElementById('f_date').value;
      p.weather=formData.weather;
      p.rating=formData.rating;
      p.who=document.getElementById('f_who').value.trim();
      p.days=document.getElementById('f_days').value.trim();
      p.food=document.getElementById('f_food').value.trim();
      p.note=document.getElementById('f_note').value.trim();
      p.photos=formPhotos.slice();
    }else{ p.photos=[]; if(!p.note)p.note=''; }

    if(isEdit){
      const {error}=await sb.from('travel_pins').update({data:pinPayload(p)}).eq('id',editingId);
      if(error)throw error;
    }else{
      const {data,error}=await sb.from('travel_pins').insert({user_id:currentUser,data:pinPayload(p)}).select('id').single();
      if(error)throw error;
      p.id=data.id; state.pins.push(p);
    }
    closeSheet(); renderPins(); checkNewBadges(_beforeBadges);
    map.flyTo([p.lat,p.lng], Math.max(map.getZoom(),9));
    toast(isEdit?'기억을 수정했어요':(formData.type==='plan'?'계획 핀을 찍었어요':'기억을 지도에 남겼어요'));
  }catch(err){ console.error(err); toast('저장 실패 — '+(err.message||'다시 시도해 주세요')); }
}

/* ---- 핀 상세 ---- */
function openDetail(id){
  const p=state.pins.find(x=>x.id===id); if(!p)return;
  if(p.type==='plan'){
    openSheet(`
      <div class="chips"><span class="chip plan">계획 · 가고 싶은 곳</span></div>
      <h3>${esc(p.name)}</h3>
      <div class="sub">${esc(p.locName)||(p.lat.toFixed(3)+', '+p.lng.toFixed(3))}</div>
      ${p.note?`<div class="note-box">${esc(p.note)}</div>`:''}
      <button class="savebtn" onclick="convertToRecord('${p.id}')">다녀왔어요 · 기록으로 전환</button>
      <button class="ghostbtn" onclick="editPin('${p.id}')">수정</button>
      <button class="ghostbtn" onclick="delPin('${p.id}')">삭제</button>
    `);
    return;
  }
  const s=seasonOf(p.date);
  const photos=p.photos||[];
  const photoBlock = photos.length
    ? `<img class="det-photo-img" src="${photos[0]}">`+(photos.length>1?`<div class="det-thumbs">${photos.slice(1).map(src=>`<img src="${src}">`).join('')}</div>`:'')
    : '';
  openSheet(`
    ${photoBlock}
    <div class="chips">
      <span class="chip weather">${weatherIcon(p.weather||'clear')} ${WEATHER_KO[p.weather]||'맑음'}</span>
      <span class="chip season">${SEASON_KO[s]}</span>
      ${p.mood?`<span class="chip">${esc(p.mood)}</span>`:''}
    </div>
    <h3>${esc(p.name)}</h3>
    <div class="sub">${[esc(p.locName),p.date].filter(Boolean).join(' · ')}</div>
    <div class="stars">${[1,2,3,4,5].map(i=>`<svg class="ic ${i<=(p.rating||0)?'fill':''}" viewBox="0 0 24 24"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>`).join('')}</div>
    ${p.note?`<div class="note-box">${esc(p.note)}</div>`:''}
    <div class="meta-grid">
      <div class="meta"><div class="ml">위치</div><div class="mv">${esc(p.locName)||'-'}</div></div>
      <div class="meta"><div class="ml">함께</div><div class="mv">${esc(p.who)||'-'}</div></div>
      <div class="meta"><div class="ml">머문 기간</div><div class="mv">${esc(p.days)||'-'}</div></div>
      <div class="meta"><div class="ml">먹은 것·한 것</div><div class="mv">${esc(p.food)||'-'}</div></div>
    </div>
    <button class="savebtn" onclick="editPin('${p.id}')">수정하기</button>
    <button class="ghostbtn" onclick="shareCard('${p.id}')">이미지 카드로 공유</button>
    <button class="ghostbtn" onclick="delPin('${p.id}')">삭제</button>
  `);
  setWeather(p.weather==='cloudy'?'clear':(p.weather||'clear'),true);
}
function editPin(id){
  const p=state.pins.find(x=>x.id===id); if(!p)return;
  openAddForm({lat:p.lat,lng:p.lng}, id);
}
async function convertToRecord(id){
  const p=state.pins.find(x=>x.id===id); if(!p)return;
  const _before=gotBadgeNames();
  p.type='record'; p.date=new Date().toISOString().slice(0,10); p.weather=p.weather||'clear'; p.rating=p.rating||0;
  try{ const {error}=await sb.from('travel_pins').update({data:pinPayload(p)}).eq('id',id); if(error)throw error; }
  catch(e){ toast('전환 실패 — 다시 시도해 주세요'); return; }
  renderPins(); closeSheet(); checkNewBadges(_before); toast('계획이 기록으로 — 색이 들어왔어요');
  setTimeout(()=>openDetail(id),350);
}
async function delPin(id){
  try{ const {error}=await sb.from('travel_pins').delete().eq('id',id); if(error)throw error; }
  catch(e){ toast('삭제 실패 — 다시 시도해 주세요'); return; }
  state.pins=state.pins.filter(x=>x.id!==id); renderPins(); closeSheet(); toast('삭제했어요');
}

/* ---- 이미지 카드 공유 ---- */
function shareCard(id){
  const p=state.pins.find(x=>x.id===id); if(!p)return;
  const s=seasonOf(p.date);
  const photo=(p.photos&&p.photos[0])||'';
  document.getElementById('cardStage').innerHTML=`
    <div class="share-card" id="theCard">
      <div class="sc-photo" style="${photo?`background-image:url(${photo})`:'background:linear-gradient(160deg,#D8C2A6,#C9AE8A)'}"></div>
      <div class="sc-body">
        <div class="sc-chips"><span>${WEATHER_KO[p.weather]||'맑음'}</span><span>${SEASON_KO[s]}</span></div>
        <div class="sc-title">${esc(p.name)}</div>
        <div class="sc-date">${[esc(p.locName)||regionGuess(p),p.date].filter(Boolean).join(' · ')}</div>
        ${p.note?`<div class="sc-note">${esc(p.note)}</div>`:''}
        <div class="sc-brand"><span class="dot"></span> 내 여행 지도</div>
      </div>
    </div>`;
  toast('카드 만드는 중…');
  if(typeof html2canvas!=='function'){toast('카드 기능 로딩 실패 — 인터넷 확인');return;}
  html2canvas(document.getElementById('theCard'),{scale:2,useCORS:true,backgroundColor:null}).then(canvas=>{
    canvas.toBlob(async blob=>{
      const file=new File([blob],(p.name||'card')+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file],title:p.name}); return; }catch(e){}
      }
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(p.name||'card')+'.png'; a.click();
      toast('이미지 카드를 저장했어요');
    },'image/png');
  }).catch(()=>toast('카드 생성 실패 — 다시 시도해 주세요'));
}

/* ---- 목록 / 배지 ---- */
function showList(){
  if(!currentUser)return;
  const recs=state.pins.filter(p=>p.type==='record').sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  openSheet(`<h3>나의 기록</h3><div class="sub">${recs.length}곳의 기억</div>`+
    (recs.length?recs.map(p=>`
      <div class="goal" onclick="closeSheet();setTimeout(()=>{map.flyTo([${p.lat},${p.lng}],10);openDetail('${p.id}')},320)">
        <div class="gi" style="background:${SEASON_COLOR[seasonOf(p.date)]};color:#fff">
          <svg class="ic" viewBox="0 0 24 24" style="stroke:#fff"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.2"/></svg></div>
        <div><div class="gt">${esc(p.name)}</div><div class="gd">${[esc(p.locName),p.date,SEASON_KO[seasonOf(p.date)],WEATHER_KO[p.weather]||'맑음'].filter(Boolean).join(' · ')}</div></div>
      </div>`).join(''):'<div class="note-box">아직 기록이 없어요. 지도를 탭해 첫 핀을 찍어보세요.</div>'));
}
function showBadges(){
  if(!currentUser)return;
  const bs=computeBadges();
  openSheet(`<h3>성취</h3><div class="sub">${bs.filter(b=>b.got).length} / ${bs.length} 모음</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:8px">
    ${bs.map(b=>`
      <div class="meta" style="text-align:center;opacity:${b.got?1:.5}">
        <div style="width:42px;height:42px;border-radius:50%;margin:2px auto 8px;display:grid;place-items:center;
          background:${b.got?'var(--clay)':'var(--surface)'};border:1px solid var(--line)">
          <svg class="ic" viewBox="0 0 24 24" style="stroke:${b.got?'#fff':'var(--clay)'}">${b.ic}</svg></div>
        <div style="font-size:12.5px;font-weight:700">${b.name}</div>
        <div style="font-size:10.5px;color:var(--ink-soft);margin-top:2px">${b.got?'달성':b.desc}</div>
      </div>`).join('')}</div>
    <button class="ghostbtn" onclick="logout()">로그아웃</button>`);
}

/* ---- 새 배지 획득 알림 ---- */
function gotBadgeNames(){ return computeBadges().filter(b=>b.got).map(b=>b.name); }
function checkNewBadges(before){
  const news=gotBadgeNames().filter(n=>!before.includes(n));
  if(news.length) celebrateBadges(news);
}
let badgePopT;
function celebrateBadges(names){
  const b=computeBadges().find(x=>x.name===names[0]);
  const extra=names.length>1?` 외 ${names.length-1}개`:'';
  const pop=document.getElementById('badgePop');
  pop.innerHTML=`<div class="bp-ic"><svg class="ic" viewBox="0 0 24 24" style="stroke:#fff;fill:none;width:22px;height:22px">${b?b.ic:''}</svg></div>
    <div><div class="bp-t">새 배지 획득!</div><div class="bp-n">${esc(names[0])}${extra}</div></div>`;
  pop.classList.add('show');
  clearTimeout(badgePopT);
  badgePopT=setTimeout(()=>pop.classList.remove('show'),3500);
}

/* ---- 날씨 이펙트 ---- */
function setWeather(w, silent){
  currentWeather=w;
  document.querySelectorAll('.wbtn[data-w]').forEach(b=>b.classList.toggle('on',b.dataset.w===w));
  const fx=document.getElementById('fx'); fx.className='weather-fx'; fx.innerHTML='';
  if(w==='rain'||w==='snow'){
    fx.classList.add(w);
    const n=w==='rain'?42:34; let html='';
    for(let i=0;i<n;i++){
      const left=Math.random()*100,
        dur=(w==='rain'?(0.5+Math.random()*0.6):(4+Math.random()*4)).toFixed(2),
        delay=(Math.random()*3).toFixed(2),
        drift=w==='snow'?`;margin-left:${(Math.random()*20-10).toFixed(0)}px`:'';
      html+=`<i style="left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s${drift}"></i>`;
    }
    fx.innerHTML=html;
  }
}

/* ---- 온보딩 ---- */
let goalPick='near';
function showOnboarding(){
  openSheet(`
    <div class="ob-ring"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></svg></div>
    <h3>이번 달, 작은 목표 하나만 정해볼까요?</h3>
    <div class="sub">거창하지 않아도 좋아요. 근교 나들이도 당신의 여행이니까요.</div>
    ${goalOpt('near','이번 달, 근교 한 곳 다녀오기','집에서 1시간 거리 안')}
    ${goalOpt('new3','이번 분기, 새 지역 3곳','안 가본 시·군')}
    ${goalOpt('free','천천히, 마음 가는 대로','목표 없이 시작')}
    <button class="savebtn" onclick="finishOnboarding()">내 지도 시작하기</button>`);
}
const goalOpt=(v,t,d)=>`<div class="goal ${v==='near'?'sel':''}" data-g="${v}" onclick="pickGoal('${v}')">
  <div class="gi"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.2"/></svg></div>
  <div><div class="gt">${t}</div><div class="gd">${d}</div></div></div>`;
function pickGoal(v){goalPick=v;document.querySelectorAll('.goal[data-g]').forEach(o=>o.classList.toggle('sel',o.dataset.g===v));}
function finishOnboarding(){localStorage.setItem(ONBOARD_KEY,'1');closeSheet();toast('좋아요. 첫 핀을 찍어볼까요?');}

/* ---- 유틸 ---- */
function esc(s){return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}
function hideHintIfAny(){const h=document.getElementById('hint');
  if(h&&state.pins.length>0){h.style.opacity='0';setTimeout(()=>{if(h.parentNode)h.remove();},500);}}

/* ---- 시작 ---- */
initMap();
sb.auth.onAuthStateChange((_e,session)=>applySession(session));
sb.auth.getSession().then(({data})=>applySession(data.session));
let qi=0;
const qEl=document.getElementById('quoteText'); qEl.style.transition='opacity .3s';
setInterval(()=>{qi=(qi+1)%QUOTES.length; qEl.style.opacity=0;
  setTimeout(()=>{qEl.textContent=QUOTES[qi];qEl.style.opacity=1;},300);},5000);
</script>
